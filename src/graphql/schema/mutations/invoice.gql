"""Response payload returned when generating an invoice."""
type GenerateInvoiceResponse {
    """Operation success flag."""
    success: Boolean!
    """Machine-friendly error code (present when success=false)."""
    code: String
    """Human-readable summary of the outcome."""
    message: String!
    """Invoice record produced by the operation."""
    invoice: Invoice
    """Validation or domain errors, if any."""
    errors: [String!]
    """ISO timestamp when the operation finished."""
    timestamp: String
}

"""Response payload returned when generating invoices for a month."""
type GenerateInvoicesForMonthResponse {
    """Operation success flag."""
    success: Boolean!
    """Machine-friendly error code (present when success=false)."""
    code: String
    """Human-readable summary of the outcome."""
    message: String!
    """Number of invoices generated."""
    count: Int!
    """Generated invoice records."""
    invoices: [Invoice!]!
    """Validation or domain errors, if any."""
    errors: [String!]
    """ISO timestamp when the operation finished."""
    timestamp: String
}

