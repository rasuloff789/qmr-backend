# Course management mutations
extend type Mutation {
    """Create a new course with scheduling, teacher, and degree associations."""
    addCourse(
        """Unique course name."""
        name: String!
        """Optional textual description."""
        description: String
        """Days of the week when the course meets."""
        daysOfWeek: [DaysOfWeek!]!
        """Gender restriction for enrollment."""
        gender: Gender!
        """Course start date."""
        startAt: Date!
        """Optional end date."""
        endAt: Date
        """Daily start time."""
        startTime: Date!
        """Daily end time."""
        endTime: Date!
        """Primary teacher identifier."""
        teacherId: ID!
        """Degrees the course is associated with."""
        degreeIds: [ID!]!
    ): AddCourseResponse!

    """Update an existing course with scheduling, teacher, and degree associations."""
    updateCourse(
        """Course identifier."""
        courseId: ID!
        """Unique course name."""
        name: String
        """Optional textual description."""
        description: String
        """Days of the week when the course meets."""
        daysOfWeek: [DaysOfWeek!]
        """Daily start time."""
        startTime: Date
        """Daily end time."""
        endTime: Date
        """Primary teacher identifier."""
        teacherId: ID
        """Degrees the course is associated with."""
        degreeIds: [ID!]
    ): UpdateCourseResponse!

    """Add a student to a course enrollment."""
    addStudentToCourse(
        """Course identifier."""
        courseId: ID!
        """Student identifier."""
        studentId: ID!
        """Monthly payment amount for the enrollment."""
        monthlyPayment: Int!
    ): AddStudentToCourseResponse!

    """Remove a student from a course enrollment."""
    removeStudentFromCourse(
        """Course identifier."""
        courseId: ID!
        """Student identifier."""
        studentId: ID!
    ): RemoveStudentFromCourseResponse!

    """Delete a course and all associated enrollments."""
    deleteCourse(
        """Course identifier."""
        courseId: ID!
    ): DeleteCourseResponse!

    """Set attendance for a student in a course on a specific date."""
    setAttendance(
        """Course identifier."""
        courseId: ID!
        """Student identifier."""
        studentId: ID!
        """Date of the attendance record."""
        date: Date!
        """Whether the student was present."""
        isPresent: Boolean!
        """Optional notes about the attendance."""
        notes: String
    ): SetAttendanceResponse!
}
