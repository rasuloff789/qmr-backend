# Teacher directory queries
extend type Query {
    """Retrieve every active teacher along with core profile data."""
    getTeachers: [Teacher!]!
    """Fetch a single teacher profile by unique identifier."""
    getTeacher(id: ID!): Teacher
    """Retrieve teachers eligible for a course by gender and required degrees."""
    getTeachersForCourse(gender: Gender!, degreeIds: [ID!]!): [Teacher!]!
}